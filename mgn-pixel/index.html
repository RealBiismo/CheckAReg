function paint(){document.querySelectorAll('canvas[data-id]').forEach(cv=>{if(cv.getBoundingClientRect().bottom<0||cv.getBoundingClientRect().top>innerHeight)return;draw(cv,designs[+cv.dataset.id],+cv.dataset.side)})}
function loop(n){t=n/1000;if(n-last>32){last=n;paint()}requestAnimationFrame(loop)}
function edit(){let d=get();$('#editname').textContent=d.name;$('#picker').value=d.color;$('#messagebox').replaceChildren();if(d.name==='Custom text'){let el=document.createElement('input');el.type='text';el.maxLength=60;el.value=d.msg;el.oninput=()=>{d.msg=el.value;state.message=el.value;save()};$('#messagebox').append(el)}$('#swatches').innerHTML=['#ff3018','#ffae00','#dfff00','#00ef88','#00deff','#347bff','#a970ff','#ff38ad','#ffffff'].map(c=>'<button data-color="'+c+'" style="background:'+c+'" aria-label="'+c+'"></button>').join('');$('#edit').showModal()}
function color(c){get().color=c;state.colors[get().id]=c;$('#picker').value=c;save();paint()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let a=b.dataset;if(a.page){page=a.page;ui();scrollTo(0,0)}if(a.cat){cat=a.cat;page='Explore';ui();scrollTo(0,0)}if(a.select!==undefined){state.current=+a.select;power=true;save();ui();if(get().name==='Custom text')edit()}if(a.action==='power'){power=!power;ui()}if(a.action==='fav'){let i=state.favs.indexOf(get().id);i<0?state.favs.push(get().id):state.favs.splice(i,1);save();ui()}if(a.action==='edit')edit();if(a.color)color(a.color)});$('#picker').oninput=e=>color(e.target.value);$('#done').onclick=()=>{$('#edit').close();ui()};ui();requestAnimationFrame(loop);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
